<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colours & Fonts Library</title>
<link rel="icon" type="image/svg+xml" href="Library%20files/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Caveat:wght@400;700&family=Inter:wght@300;500;900&family=Poppins:wght@600&family=Pinyon+Script&family=Instrument+Serif:ital@0;1&family=Bodoni+Moda:wght@700&family=Great+Vibes&family=Cormorant+Garamond:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Courier+Prime&family=Kalam:wght@400;700&family=Montserrat:wght@500;800&family=Playfair+Display:ital@1&family=Nunito:wght@800&family=Gochi+Hand&family=Damion&family=GFS+Didot&family=Bebas+Neue&family=Oswald:wght@700&family=Bowlby+One&family=Questrial&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;800&family=Comfortaa:wght@700&family=Gloock&family=Bagel+Fat+One&family=Rozha+One&family=Mr+Dafoe&family=League+Gothic&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=Jost:wght@300&family=Space+Mono:wght@400;700&family=Homemade+Apple&family=Libre+Baskerville&family=Reenie+Beanie&family=Archivo+Black&family=Nothing+You+Could+Do&family=Syne:wght@600&family=Kaushan+Script&display=swap">
<style>
:root{
  --bg:#0e0e10; --dot:rgba(255,255,255,.075); --card:#18181b; --card2:#222227; --ink:#f4f1e8; --muted:#a9a59b;
  --pink:#f49ad9; --cyan:#bdeff7; --yellow:#f9c93d; --green:#9be37f; --red:#E3261C; --black:#0e0e10;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif;
  background:radial-gradient(var(--dot) 1px,transparent 1.3px) 0 0/22px 22px,var(--bg)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

/* header */
header.top{padding:56px 0 34px;position:relative}
h1{font:400 clamp(44px,9vw,104px)/.92 "Archivo Black",sans-serif;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{height:clamp(84px,13vw,150px);width:auto;flex:none}
.hatch{height:18px;border:2px solid var(--ink);border-radius:4px;margin-top:30px;
  background:repeating-linear-gradient(-45deg,var(--pink) 0 10px,var(--black) 10px 20px)}

/* nav */
nav.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--ink)}
nav.bar .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:12px;padding-bottom:12px;scrollbar-width:none}
nav.bar a{flex:none;text-decoration:none;font:700 13px "DM Sans";padding:6px 14px;border:2px solid var(--ink);border-radius:999px;color:var(--ink);background:var(--card)}
nav.bar a:hover{background:var(--cyan);color:var(--black)}

/* sections */
section{padding:64px 0 8px}
.shead{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.num{font:700 12px "Space Mono",monospace;background:var(--cyan);color:var(--black);border:2px solid var(--ink);border-radius:999px;padding:3px 11px}
h2{font:400 clamp(28px,4.5vw,44px)/1 "Archivo Black",sans-serif;margin:0;letter-spacing:-.01em}
h3{font:400 21px/1.1 "Archivo Black",sans-serif;margin:34px 0 14px}
.note{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chipbtn{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:5px 13px;font:700 13px "DM Sans";cursor:pointer}
.chipbtn .ct{font-weight:400;opacity:.7;margin-left:5px}
.chipbtn[aria-pressed="true"]{background:var(--yellow);color:var(--black);box-shadow:2px 2px 0 var(--ink)}

/* shared card look */
.box{background:var(--card);border:2px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 var(--sh,var(--ink));overflow:hidden}

/* colour swatches */
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.sw{cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;--sh:#3a3a40;transition:transform .12s, box-shadow .12s}
.sw:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--c)}
.sw .blk{height:86px;border-bottom:2px solid var(--ink)}
.sw .meta{padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px}
.sw .nm{font-weight:700;font-size:14px;line-height:1.25}
.sw .hx{font:12.5px "Space Mono",monospace;color:var(--muted)}
.tag{display:inline-block;font:700 11px "DM Sans";padding:2px 8px;border-radius:999px;margin-top:4px;width:max-content;color:var(--black);border:1.5px solid var(--black)}
.tag.good{background:var(--green)}
.tag.ok{background:var(--yellow)}
.tag.weak{background:#ff9b8f}

/* combination cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{display:flex;flex-direction:column}
.card .pv .slide{border-bottom:2px solid var(--ink)}
.card .body{padding:14px;display:flex;flex-direction:column;gap:11px;flex:1}
.ttl{font:400 17px/1.2 "Archivo Black",sans-serif}
.why{font-size:13px;color:var(--muted)}
.strip{display:flex;border-radius:8px;overflow:hidden;border:2px solid var(--ink)}
.strip button{flex:1;border:0;padding:0;cursor:pointer;min-height:58px;display:flex;align-items:flex-end}
.strip button span{font:10.5px "Space Mono",monospace;padding:4px 6px}
.names{display:grid;gap:3px;font-size:12.5px}
.names div{display:flex;gap:8px;align-items:center}
.names .dot{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid var(--ink)}
.names .hx{font-family:"Space Mono",monospace;color:var(--muted);margin-left:auto;font-size:11.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.btn{background:var(--card2);border:2px solid var(--ink);border-radius:8px;padding:5px 11px;font:700 12.5px "DM Sans";cursor:pointer}
.btn:hover{background:var(--cyan);color:var(--black)}
.btn.primary{background:var(--pink);color:var(--black);box-shadow:3px 3px 0 var(--ink)}
.btn.primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;border:2px solid var(--ink);cursor:zoom-in;flex:none}
.cardhead{display:flex;gap:10px;align-items:center}

/* slide preview */
.slide{position:relative;aspect-ratio:4/5;container-type:inline-size;overflow:hidden;background:var(--sbg,#000);color:var(--main,#fff);display:flex;align-items:center;justify-content:center;text-align:center;isolation:isolate}
.slide.wide{aspect-ratio:16/10}
.slide .img{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2}
.slide .shade{position:absolute;inset:0;background:#000;z-index:-1}
.slide .lock{position:absolute;top:6.5cqw;left:0;right:0;font:600 3.7cqw/1 Fraunces}
.slide .handle{position:absolute;bottom:6cqw;left:0;right:0;font:500 3.4cqw/1 Fraunces}
.slide .q{--fs:8.4cqw;padding:0 9cqw;line-height:1.1;width:100%}
.slide.wide .q{--fs:7.6cqw}
.slide.photo .q,.slide.photo .lock,.slide.photo .handle{text-shadow:0 .3cqw 2.4cqw rgba(0,0,0,.35)}
.q .ln{display:block}
.q .ln + .ln{margin-top:.12em}
.strike{position:relative;display:inline-block}
.strike::after{content:"";position:absolute;left:-5%;right:-5%;top:44%;height:.22em;background:var(--red);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 20' preserveAspectRatio='none'><path d='M3 14 C35 9 70 12 105 8 S170 6 197 9' fill='none' stroke='black' stroke-width='6' stroke-linecap='round'/></svg>") center/100% 100% no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 20' preserveAspectRatio='none'><path d='M3 14 C35 9 70 12 105 8 S170 6 197 9' fill='none' stroke='black' stroke-width='6' stroke-linecap='round'/></svg>") center/100% 100% no-repeat}
.ul{position:relative;display:inline-block;color:var(--acc)}
.ul::after{content:"";position:absolute;left:-3%;right:-3%;bottom:-.04em;height:.15em;background:var(--acc);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 20' preserveAspectRatio='none'><path d='M4 12 C45 7 85 15 125 10 S182 8 196 11' fill='none' stroke='black' stroke-width='5' stroke-linecap='round'/></svg>") center/100% 100% no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 20' preserveAspectRatio='none'><path d='M4 12 C45 7 85 15 125 10 S182 8 196 11' fill='none' stroke='black' stroke-width='5' stroke-linecap='round'/></svg>") center/100% 100% no-repeat}
.boxed{display:inline-block;background:var(--acc);color:var(--boxink);padding:.04em .22em 0;line-height:1.05}
.minis{display:flex;position:absolute;left:5cqw;bottom:5cqw;gap:1.4cqw}
.minis i{width:4.2cqw;height:4.2cqw;border-radius:50%;border:.4cqw solid rgba(255,255,255,.4)}

/* fonts */
.wordbar{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:18px;--sh:var(--pink)}
.wordbar label{font:400 16px "Archivo Black",sans-serif;flex:none}
input[type=text],select{background:var(--bg);border:2px solid var(--ink);border-radius:8px;padding:8px 10px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.fcard{padding:14px;display:flex;flex-direction:column;gap:8px;--sh:#3a3a40}
.fname{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spec{min-height:76px;display:flex;align-items:center;line-height:1.15;overflow-wrap:anywhere}
.pill{font:700 11px "DM Sans";padding:1px 9px;border-radius:999px;border:1.5px solid var(--black);color:var(--black)}
.pill.clean{background:var(--cyan)}
.pill.expr{background:var(--pink)}

/* font pairings */
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.setcard{display:flex;flex-direction:column}
.setcard .slide{border-bottom:2px solid var(--ink)}
.setcard .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.setcard .ttl{font-size:15px}

/* mix & match */
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,440px);gap:26px;align-items:start}
.panel{padding:18px;display:flex;flex-direction:column;gap:18px;--sh:var(--cyan)}
.field{display:flex;flex-direction:column;gap:7px}
.lbl{font:400 14px "Archivo Black",sans-serif;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl .val{font:12px "Space Mono",monospace;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px;max-height:136px;overflow-y:auto;padding:3px}
.dots button{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);cursor:pointer;padding:0}
.dots button[aria-pressed="true"]{outline:3px solid var(--yellow);outline-offset:2px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos button{width:52px;height:64px;border-radius:8px;border:2px solid var(--ink);background-size:cover;background-position:center;cursor:pointer;padding:0}
.photos button[aria-pressed="true"]{outline:3px solid var(--yellow);outline-offset:2px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:5px 13px;cursor:pointer;font:700 13px "DM Sans"}
.seg button + button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--black)}
.stage{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px}
.stage .slidebox{--sh:var(--pink)}
.readout{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;width:max-content}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:44px;height:24px;border:2px solid var(--ink);border-radius:999px;background:var(--card2);position:relative;flex:none;transition:background .15s}
.track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:left .15s}
.toggle input:checked + .track{background:var(--yellow)}
.toggle input:checked + .track::after{left:22px;background:var(--black)}
.toggle input:focus-visible + .track{outline:3px solid var(--yellow);outline-offset:2px}
.lockfields{display:flex;flex-direction:column;gap:10px;padding:12px;border:2px dashed #5a5a62;border-radius:10px}
input[type=range]{width:100%;accent-color:var(--yellow)}

dialog{border:2px solid var(--ink);border-radius:12px;padding:0;background:var(--card);color:var(--ink);max-width:min(92vw,900px);max-height:92vh;box-shadow:6px 6px 0 var(--pink)}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog img{display:block;max-width:100%;max-height:84vh;margin:auto}
dialog .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:13px;gap:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--yellow);color:var(--black);border:2px solid var(--ink);padding:7px 16px;border-radius:999px;font:700 13px "DM Sans";transition:.25s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
main{padding-bottom:80px}

@media (max-width:820px){
  .play{grid-template-columns:1fr}
  .stage{position:static;order:-1}
  .stage .slidebox{max-width:380px;margin:0 auto;width:100%}
}
@media (max-width:420px){ .cgrid{grid-template-columns:1fr} .two{grid-template-columns:1fr} }
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PIC = n => encodeURI('Colours/WhatsApp Image 2026-10-09 at ' + n + '.jpeg');
const FPIC = n => encodeURI('Fonts/WhatsApp Image 2026-10-09 at ' + n + '.jpeg');
const PHOTO = n => encodeURI('Library files/bali-' + n + '.jpg');
const rgb = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
const lum = h => { const [r,g,b] = rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126*r + .7152*g + .0722*b; };
const contrast = (a, b) => { const A = lum(a), B = lum(b); return (Math.max(A,B) + .05) / (Math.min(A,B) + .05); };
const hsl = h => { const [r,g,b] = rgb(h).map(v => v / 255); const mx = Math.max(r,g,b), mn = Math.min(r,g,b); let H = 0, S = 0; const L = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; S = L > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    H = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) : mx === g ? ((b - r) / d + 2) : ((r - g) / d + 4); H *= 60; }
  return [H, S, L]; };
const inkOn = h => contrast(h, '#111111') >= contrast(h, '#ffffff') ? '#111111' : '#ffffff';
const SMALL_WORDS = new Set(['a','an','the','and','or','but','of','to','in','on','for','with','at','by','as','from']);
const tc = s => String(s).split(' ').map((w, i) => i > 0 && SMALL_WORDS.has(w.toLowerCase()) ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
const toHex = n => '#' + n.map(v => Math.round(v).toString(16).padStart(2, '0')).join('').toUpperCase();
const PHOTO_REF = '#222222';   // roughly what a darkened Bali photo looks like behind the text
function rating(h) {
  const c = contrast(h, PHOTO_REF);
  if (c >= 4.5) return ['good', 'Great on a dark photo'];
  if (c >= 3) return ['ok', 'Good for big words'];
  return ['weak', 'Too dark on a photo'];
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1600); }
function copy(text, msg) {
  const done = () => toast(msg || ('Copied ' + text));
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast(text); } ta.remove(); }
}
function view(src, cap) { $('#viewerImg').src = src; $('#viewerCap').textContent = cap || ''; $('#viewer').showModal(); }
$('#viewerClose').onclick = () => $('#viewer').close();

// words wrapped in ~~ get the red hand drawn strike
const lockHTML = t => esc(t).replace(/~~(.+?)~~/g, '<span class="strike">$1</span>');

function slideHTML(o) {
  const set = setBy(o.set);
  const main = o.main ?? SAMPLE.main, stress = o.stress ?? SAMPLE.stress;
  const photo = o.mode === 'photo';
  const stressSpan = `<span class="${set.box ? 'boxed' : 'ul'}" style="${fstyle(set.s)}">${esc(stress)}</span>`;
  return `<div class="slide ${photo ? 'photo' : ''} ${o.wide ? 'wide' : ''}" style="--sbg:${photo ? '#000' : o.bg};--main:${o.text};--acc:${o.acc};--boxink:${inkOn(o.acc)}">
    ${photo ? `<div class="img" style="background-image:url('${PHOTO(o.photo)}')"></div><div class="shade" style="opacity:${(o.shade ?? 45) / 100}"></div>` : ''}
    ${o.lockup ? `<div class="lock">${lockHTML(o.lockText ?? DEFAULT_LOCK)}</div><div class="handle">${esc(o.handle ?? DEFAULT_HANDLE)}</div>` : ''}
    <div class="q"><span class="ln" style="${fstyle(set.m)}">${esc(main)}</span><span class="ln">${stressSpan}</span></div>
    ${o.minis ? `<div class="minis">${o.minis.map(h => `<i style="background:${h}"></i>`).join('')}</div>` : ''}
  </div>`;
}

/* best background / text / accent arrangements for a set of colours */
function arrangements(hexes) {
  if (hexes.length === 2) { const [a, b] = hexes; return [{ bg:a, text:b, acc:b }, { bg:b, text:a, acc:a }]; }
  const out = [];
  hexes.forEach(bg => hexes.forEach(t => hexes.forEach(a => {
    if (bg === t || bg === a || t === a) return;
    const score = Math.min(contrast(t, bg), 7) + .8 * Math.min(contrast(a, bg), 4.5) + 1.6 * hsl(a)[1] - (hsl(bg)[1] > .8 && hsl(bg)[2] > .45 ? 1.5 : 0);
    out.push({ bg, text:t, acc:a, score });
  })));
  return out.sort((x, y) => y.score - x.score).slice(0, 6);
}

const comboState = new Map();

let fontCursor = 0;

function comboCard(id, o) {
  const hexes = o.cols.map(col => col.hex);
  const auto = arrangements(hexes);
  const arr = o.fixed ? [o.fixed, ...auto.filter(a => !(a.bg === o.fixed.bg && a.text === o.fixed.text && a.acc === o.fixed.acc))] : auto;
  comboState.set(id, { arr, ai: 0, font: o.font || FONT_ROTATION[fontCursor++ % FONT_ROTATION.length], cols: hexes });
  return `<article class="box card" data-combo="${id}" data-type="${o.type}">
    <div class="pv"></div>
    <div class="body">
      <div class="cardhead">${o.pic ? `<img class="thumb" src="${o.pic}" alt="Source picture" loading="lazy" data-view="${o.pic}" data-cap="${esc(o.title)}">` : ''}<div class="ttl">${esc(o.title)}</div></div>

function buildColours() {
  // every colour
  const FAM = ['Reds & Pinks', 'Oranges & Browns', 'Yellows', 'Greens', 'Blues & Teals', 'Purples', 'Light & Creams', 'Darks & Neutrals'];
  const family = h => {
    const [H, S, L] = hsl(h);
    if (L < .2 || (S < .13 && L < .86)) return FAM[7];
    if (L > .86) return FAM[6];
    if (H < 12 || H >= 300) return FAM[0];
    if (H < 45) return FAM[1];
    if (H < 70) return FAM[2];
    if (H < 165) return FAM[3];
    if (H < 245) return FAM[4];
    return FAM[5];
  };
  const list = [...COLOURS.values()].map(col => ({ ...col, fam: family(col.hex) }));
  list.sort((a, b) => FAM.indexOf(a.fam) - FAM.indexOf(b.fam) || hsl(b.hex)[2] - hsl(a.hex)[2]);
  let filter = 'All';
  const renderChips = () => { $('#hueChips').innerHTML = ['All', ...FAM].map(ch => `<button type="button" class="chipbtn" aria-pressed="${ch === filter}" data-f="${esc(ch)}">${esc(ch)}<span class="ct">${ch === 'All' ? list.length : list.filter(x => x.fam === ch).length}</span></button>`).join(''); };
  const renderGrid = () => {
    $('#allColours').innerHTML = list.filter(x => filter === 'All' || x.fam === filter).map(col => {
      const [cls, txt] = rating(col.hex);
      return `<button type="button" class="box sw" style="--c:${col.hex}" data-copy="${col.hex}" title="Copy ${col.hex}">
        <div class="blk" style="background:${col.hex}"></div>
        <div class="meta"><span class="nm">${esc(col.name)}</span><span class="hx">${col.hex}</span><span class="tag ${cls}">${txt}</span></div>
      </button>`;
    }).join('');
  };
  $('#hueChips').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; renderChips(); renderGrid(); });
  renderChips(); renderGrid();

  // every combination (pictures, earlier palettes and ideas together)
  let html = '';
  PICTURE_GROUPS.forEach((g, gi) => g.combos.forEach((cb, i) => {
    const id = `pic-${gi}-${i}`;
    const pic = cb.pic ? PIC(cb.pic) : cb.fpic ? FPIC(cb.fpic) : '';
    const title = tc(cb.name || cb.cols.map(x => x.name).join(' + '));
    COMBOS.push({ id, title, type: g.type });
    html += comboCard(id, { title, type: g.type, cols: cb.cols, pic });
  }));
  IDEAS.forEach((cb, i) => {
    const id = 'idea-' + i;
    COMBOS.push({ id, title: cb.name, type: 'Ideas' });
    html += comboCard(id, { title: cb.name, why: cb.why, type: 'Ideas', cols: cb.cols.map(byHex), fixed: { bg: cb.cols[0], text: cb.cols[1], acc: cb.cols[2] }, font: cb.font });
  });
  $('#allCombos').innerHTML = html;
  comboState.forEach((_, id) => paintCombo(id));

  const TYPES = ['Trios', 'Five Colour Palettes', 'Pairs', 'Ideas'];
  let ctype = 'All';
  const renderComboChips = () => { $('#comboChips').innerHTML = ['All', ...TYPES].map(t => `<button type="button" class="chipbtn" aria-pressed="${t === ctype}" data-t="${t}">${t}<span class="ct">${t === 'All' ? COMBOS.length : COMBOS.filter(x => x.type === t).length}</span></button>`).join(''); };
  $('#comboChips').addEventListener('click', e => {
    const b = e.target.closest('[data-t]'); if (!b) return; ctype = b.dataset.t; renderComboChips();
    document.querySelectorAll('#allCombos > .card').forEach(card => { card.style.display = ctype === 'All' || card.dataset.type === ctype ? '' : 'none'; });
  });
  renderComboChips();
}

  $('#pHandle').oninput = e => { P.handle = e.target.value; paintPlay(); };
  $('#pMode').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; P.mode = b.dataset.v; paintPlay(); };
  $('#pPhotos').onclick = e => { const b = e.target.closest('[data-ph]'); if (!b) return; P.photo = +b.dataset.ph; P.mode = 'photo'; paintPlay(); };
  $('#panel').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; P[b.dataset.k] = b.dataset.h; if (b.dataset.k === 'bg') P.mode = 'solid'; paintPlay(); });
  $('#pCombo').onchange = e => { if (!e.target.value) return; Object.assign(P, comboToState(e.target.value)); paintPlay(); };
  $('#pCopy').onclick = () => {
    const s = setBy(P.set);
    const bgTxt = P.mode === 'photo' ? `Photo IMG_${P.photo} darkened ${P.shade}%` : `Background ${byHex(P.bg).name} ${P.bg}`;
    copy(`Set ${s.n} (${s.m.f} + ${s.s.f}) · ${bgTxt} · Main text ${byHex(P.text).name} ${P.text} · Stressed ${byHex(P.acc).name} ${P.acc}`, 'Recipe copied');
  };
  $('#pRandom').onclick = () => {
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const goodAcc = [...COLOURS.keys()].filter(h => contrast(h, PHOTO_REF) >= 3.5 && hsl(h)[1] > .55 && hsl(h)[2] < .85);
    Object.assign(P, { set: pick(SETS).n, mode: 'photo', photo: pick(PHOTOS).id, text: '#FFFFFF', acc: pick(goodAcc), shade: 45 });
    paintPlay();
  };
  paintPlay();
}
function paintPlay() {
  $('#pSet').value = P.set;
  $('#pShade').value = P.shade; $('#pShadeVal').textContent = P.shade + '%';
  $('#pMode').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === P.mode));
  $('#pPhotos').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', P.mode === 'photo' && +b.dataset.ph === P.photo));
  $('#pShadeWrap').style.display = P.mode === 'photo' ? '' : 'none';
  $('#pLockFields').style.display = P.lockup ? '' : 'none';
  $('#pBg').innerHTML = dotsHTML('bg'); $('#pText').innerHTML = dotsHTML('text'); $('#pAcc').innerHTML = dotsHTML('acc');
  $('#pTextName').textContent = `${byHex(P.text).name} ${P.text}`;
  $('#pAccName').textContent = `${byHex(P.acc).name} ${P.acc}`;
  $('#pSlide').innerHTML = slideHTML({ ...P });
  const behind = P.mode === 'photo' ? toHex(Array(3).fill(128 * (1 - P.shade / 100))) : P.bg;
  const r = (a, b) => { const v = contrast(a, b); return `${v.toFixed(1)} ${v >= 4.5 ? '(easy to read)' : v >= 3 ? '(fine for big words)' : '(hard to read)'}`; };
  $('#pRead').innerHTML = `<span>Main text contrast: ${r(P.text, behind)}</span><span>Stressed word contrast: ${r(P.acc, behind)}</span>`;
}
function openPlay(o) { Object.assign(P, o); paintPlay(); document.getElementById('mix').scrollIntoView(); }

/* ---------- global clicks ---------- */
document.addEventListener('click', e => {
  const cp = e.target.closest('[data-copy]'); if (cp) { copy(cp.dataset.copy); return; }
  const v = e.target.closest('[data-view]'); if (v) { view(v.dataset.view, v.dataset.cap); return; }
  const os = e.target.closest('[data-openset]');
  if (os) { openPlay({ set: +os.dataset.openset, acc: os.dataset.acc, mode: 'photo', photo: +os.dataset.photo, text: '#FFFFFF' }); return; }
  const act = e.target.closest('[data-act]');
  if (act) {
    const id = act.closest('[data-combo]').dataset.combo, st = comboState.get(id);
    if (act.dataset.act === 'shuffle') { st.ai++; paintCombo(id); }
    if (act.dataset.act === 'font') { const i = FONT_ROTATION.indexOf(st.font); st.font = FONT_ROTATION[(i + 1) % FONT_ROTATION.length]; paintCombo(id); }
    if (act.dataset.act === 'open') openPlay(comboToState(id));
  }
});

/* ---------- go ---------- */
buildColours();
renderFonts();
renderSets();
buildPlay();
</script>
</body>
